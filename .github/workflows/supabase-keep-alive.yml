name: Supabase Keep-Alive

on:
  schedule:
    # Runs every 3 days at 08:00 UTC (15:00 Bangkok time)
    # Cron: minute hour day-of-month month day-of-week
    - cron: "0 8 */3 * *"
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  keep-alive:
    name: Ping Supabase to Prevent Pausing
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase REST API
        run: |
          # Sanitize inputs to prevent curl URL formatting errors
          CLEAN_URL=$(echo "${{ secrets.SUPABASE_URL }}" | tr -d '"' | tr -d "'" | tr -d ' ' | tr -d '\n' | tr -d '\r')
          CLEAN_KEY=$(echo "${{ secrets.SUPABASE_ANON_KEY }}" | tr -d '"' | tr -d "'" | tr -d ' ' | tr -d '\n' | tr -d '\r')
          
          # Remove trailing slash from URL if present
          CLEAN_URL=${CLEAN_URL%/}

          PING_TIME=$(date '+%Y-%m-%d %H:%M:%S UTC')
          SUPABASE_HOST=$(echo "$CLEAN_URL" | sed 's|https://||' | sed 's|http://||')

          echo "============================================"
          echo "  🚀 Supabase Keep-Alive Ping"
          echo "============================================"
          echo "  ⏰ Time    : $PING_TIME"
          echo "  🌐 Project : $SUPABASE_HOST"
          echo "  📍 Endpoint: /rest/v1/"
          echo "--------------------------------------------"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${CLEAN_URL}/rest/v1/?apikey=${CLEAN_KEY}" \
            -H "apikey: ${CLEAN_KEY}" \
            -H "Authorization: Bearer ${CLEAN_KEY}")

          echo "  📡 HTTP Status : $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "  ✅ Result  : SUCCESS — Supabase is alive!"
          elif [ "$HTTP_STATUS" -eq 401 ] || [ "$HTTP_STATUS" -eq 403 ]; then
            echo "  ✅ Result  : SUCCESS — Project is active (auth required)"
          else
            echo "  ❌ Result  : FAILED — Unexpected status $HTTP_STATUS"
            echo "============================================"
            exit 1
          fi

          echo "============================================"
