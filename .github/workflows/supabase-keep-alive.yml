name: Supabase Keep-Alive

on:
  schedule:
    # Runs every 3 days at 08:00 UTC (15:00 Bangkok time)
    - cron: "0 8 */3 * *"
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Supabase to Prevent Pausing
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          PING_TIME=$(date '+%Y-%m-%d %H:%M:%S UTC')
          SUPABASE_HOST=$(echo "$SUPABASE_URL" | sed 's|https://||')

          echo "============================================"
          echo "  🚀 Supabase Keep-Alive Ping"
          echo "============================================"
          echo "  ⏰ Time    : $PING_TIME"
          echo "  🌐 Project : $SUPABASE_HOST"
          echo "  📍 Endpoint: /rest/v1/"
          echo "--------------------------------------------"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${SUPABASE_URL}/rest/v1/" -H "apikey: ${SUPABASE_ANON_KEY}" -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "  📡 HTTP Status : $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "  ✅ Result  : SUCCESS — Supabase is alive!"
          elif [ "$HTTP_STATUS" -eq 401 ] || [ "$HTTP_STATUS" -eq 403 ]; then
            echo "  ✅ Result  : SUCCESS — Project is active (auth required)"
          else
            echo "  ❌ Result  : FAILED — Unexpected status $HTTP_STATUS"
            echo "============================================"
            exit 1
          fi

          echo "============================================"
